# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - auth-polarforecast

on:
  push:
    branches:
      - Test
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://highlanderscouting.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_ed4472511ece47fd93c7702241100124 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_6a0640cf9bd9428ea0ed00789d531869 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: highlanderscouting.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_ed4472511ece47fd93c7702241100124 }}/keycloak:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'auth-polarforecast'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_e2edf00722734a38904dd340736bf59f }}
        images: 'highlanderscouting.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_ed4472511ece47fd93c7702241100124 }}/keycloak:${{ github.sha }}'