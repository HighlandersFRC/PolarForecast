name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - prod

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      - uses: subosito/flutter-action@v2
        name: Set up Flutter actions
        with:
          channel: 'stable'
  
      - name: Get dependencies
        working-directory: ./APP
        run: flutter pub get
  
      - name: Build web app
        working-directory: ./APP
        run: flutter build web --release --dart-define PF_API_ENDPOINT=${{vars.PF_API_ENDPOINT}} --dart-define KEYCLOAK_REALM=${{secrets.KEYCLOAK_REALM}} --dart-define KEYCLOAK_APP_CLIENT_ID=${{secrets.KEYCLOAK_APP_CLIENT_ID}} --dart-define PF_KEYCLOAK_LOGIN_IP=${{secrets.PF_KEYCLOAK_LOGIN_IP}} --dart-define APP_DOMAIN=${{secrets.APP_DOMAIN}} --dart-define APP_TBA_KEY=${{secrets.APP_TBA_KEY}}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_SKY_06CF0AD10 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "APP/build/web" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "APP/build/web" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
