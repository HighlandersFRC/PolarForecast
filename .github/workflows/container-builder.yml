on:
  push:
    branches:
      - prod

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        # checkout the repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@main
          
        - name: 'Login via Azure CLI'
          uses: azure/login@v1
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}
        
        - name: 'Build and push Keycloak Image'
          uses: azure/docker-login@v1
          with:
            login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
            username: ${{ secrets.REGISTRY_USERNAME }}
            password: ${{ secrets.REGISTRY_PASSWORD }}
        - run: |
            docker build AUTH -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/keycloak:latest
            docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/keycloak:latest
    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
          name: 'production'
          url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
        steps:
        - name: Deploy to Azure Web App
          id: deploy-to-webapp
          uses: azure/webapps-deploy@v2
          with:
            app-name: 'HighlanderScoutingKeycloak'
            slot-name: 'production'
            publish-profile: ${{ secrets.AzureAppService_PublishProfile_77a861e6874340409e32da87915fcdfd }}
            images: 'highlanderscouting.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_894a66622b344887b97ea38a0840b94f }}/keycloak:latest'
