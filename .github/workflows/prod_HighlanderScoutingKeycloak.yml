# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - HighlanderScoutingKeycloak

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://highlanderscouting.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_894a66622b344887b97ea38a0840b94f }}
        password: ${{ secrets.AzureAppService_ContainerPassword_b56a5e3aef6947379cf55fbe3b1c20b2 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: highlanderscouting.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_894a66622b344887b97ea38a0840b94f }}/Keycloak:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'HighlanderScoutingKeycloak'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_77a861e6874340409e32da87915fcdfd }}
        images: 'highlanderscouting.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_894a66622b344887b97ea38a0840b94f }}/Keycloak:${{ github.sha }}'