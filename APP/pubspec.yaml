name: scouting_app
description: A Flutter app for scouting with a tab bar.

version: 1.0.0

environment:
  sdk: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  http: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_colorpicker: ^1.0.3
  flutter_form_builder: ^10.3.0+2
  image: ^4.8.0
  pretty_qr_code: ^3.3.0
  flutter_cache_manager: ^3.4.1
  flutter_bloc: ^9.1.1
  dio: ^5.5.0+1
  syncfusion_flutter_datagrid: ^33.1.46
  flat: ^0.5.0
  syncfusion_flutter_charts: ^33.1.46
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_drawing_board: ^1.0.1+2
  scribble: ^0.10.0+1
  path_provider: ^2.1.5
  number_paginator: ^0.4.1
  flutter_dotenv: ^6.0.0
  flutter_appauth: ^12.0.0
  url_launcher: ^6.3.2
  image_picker_for_web: ^3.0.6
  csv: ^6.0.0
  syncfusion_flutter_core: ^33.1.46
  qr_code_scanner_plus: ^2.1.1
  palette_generator: ^0.3.3+7
  extended_image: ^10.0.1
dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0
  lint: ^2.8.0

flutter:
  uses-material-design: true

  assets:
    - staticwebapp.config.json
    - assets/PolarBearHead.png
    - assets/2024GameField.png
    - assets/2024BlankAutoField.png
    - assets/Note.png
    - assets/AutosGameField.png
    - assets/2025 REEFSCAPE Gray Background blue.png
    - assets/2025 REEFSCAPE Gray Background red.png
    - assets/2026GameField.png
    - assets/2026GameField_Blue.png
    - assets/2026GameField_Red.png
    - assets/2025GameField.png
    - assets/documentation/

  fonts:
    - family: Font
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf #Light
        - asset: assets/fonts/Roboto-Bold.ttf #Bold
          weight: 700
