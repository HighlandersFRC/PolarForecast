name: PF
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using pub publish.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# iOS build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# See more keys at developer.apple.com
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically get dependencies, run 'flutter pub get' or 'flutter pub upgrade'.
# A list of prerequisites for following the instructions is located in the flutter
# repository for this guide at: flutter.dev
dependencies:
  flutter:
    sdk: flutter
  # Add your own dependencies here, e.g.,
  # cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The "flutter_lints" package below contains a set of recommended lints
  # to encourage good coding practices. The documentation is published at:
  # pub.dev
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: dart.dev

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included in your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # An image asset can be specified a top-level key.
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding Flutter assets, see
  # flutter.dev
  #
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key and a "fonts" key with a list giving the asset and
  # other properties.
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies, see
  # flutter.dev
